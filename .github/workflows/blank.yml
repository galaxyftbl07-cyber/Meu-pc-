
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Virtual PC</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:white;
 background:linear-gradient(135deg,#071b42,#1768a5,#101c3c);
 height:100vh;
 overflow:hidden;
}
.desktop{padding:20px}
.icon{
 width:85px;
 text-align:center;
 margin:15px 0;
 cursor:pointer;
 font-size:35px;
}
.icon span{display:block;font-size:13px;margin-top:5px}
.taskbar{
 position:absolute;bottom:0;width:100%;height:58px;
 background:#101b2be8;
 display:flex;align-items:center;
 justify-content:center;gap:25px;
}
.taskbar button{
 background:none;border:0;color:white;font-size:25px;
}
.clock{position:absolute;right:12px;font-size:12px}
.window{
 display:none;position:absolute;top:15%;left:5%;
 width:90%;height:65%;background:#172b46;
 border:1px solid #6689ad;border-radius:12px;
 padding:15px;box-shadow:0 8px 30px #0008;
}
.window h2{margin-top:0}
.close{float:right;background:#d33;color:white;border:0;padding:7px}
.start{
 display:none;position:absolute;bottom:65px;left:50%;
 transform:translateX(-50%);
 background:#172b46;padding:20px;border-radius:15px;
 width:85%;max-width:350px;text-align:center;
}
.start button{
 padding:12px;margin:5px;border:0;border-radius:8px;
}
</style>
</head>
<body>
<div class="desktop">
 <h3>💻 PH Virtual PC</h3>
 <div class="icon" onclick="openApp('Arquivos')">📁<span>Arquivos</span></div>
 <div class="icon" onclick="openApp('Navegador')">🌐<span>Navegador</span></div>
 <div class="icon" onclick="openApp('Configurações')">⚙️<span>Configurações</span></div>
 <div class="icon" onclick="openApp('Sobre')">🖥️<span>Meu PC</span></div>
</div>

<div class="window" id="window">
 <button class="close" onclick="closeApp()">Fechar ✕</button>
 <h2 id="appTitle"></h2>
 <div id="appContent"></div>
</div>

<div class="start" id="start">
 <h2>Iniciar</h2>
 <button onclick="openApp('Arquivos')">📁 Arquivos</button>
 <button onclick="openApp('Navegador')">🌐 Navegador</button>
 <button onclick="openApp('Configurações')">⚙️ Configurações</button>
</div>

<div class="taskbar">
 <button onclick="toggleStart()">⊞</button>
 <button onclick="openApp('Arquivos')">📁</button>
 <button onclick="openApp('Navegador')">🌐</button>
 <div class="clock" id="clock"></div>
</div>

<script>
function openApp(name){
 document.getElementById('window').style.display='block';
 document.getElementById('start').style.display='none';
 document.getElementById('appTitle').innerText=name;
 let content={
 'Arquivos':'<p>📁 Meus arquivos</p><p>📂 Documentos</p><p>📂 Imagens</p>',
 'Navegador':'<p>🌐 Navegador virtual</p><input id="site" placeholder="Digite um endereço" style="padding:10px;width:100%"><button onclick="goSite()" style="margin-top:10px;padding:10px">Abrir site</button><p id="result"></p>',
 'Configurações':'<p>⚙️ Configurações do sistema</p><p>Nome: PH Virtual PC</p><p>Versão: 1.0</p>',
 'Sobre':'<p>🖥️ PH Virtual PC</p><p>Sistema iniciado com sucesso!</p>'
 };
 document.getElementById('appContent').innerHTML=content[name]||'';
}
function closeApp(){
 document.getElementById('window').style.display='none';
}
function toggleStart(){
 let s=document.getElementById('start');
 s.style.display=s.style.display==='block'?'none':'block';
}
function goSite(){
 let value=document.getElementById('site').value.trim();
 if(!value)return;
 if(!/^https?:\/\//i.test(value))value='https://'+value;
 document.getElementById('result').innerHTML=
 '<a style="color:#8ed5ff" target="_blank" rel="noopener" href="'+value+'">Abrir '+value+'</a>';
}
function updateClock(){
 document.getElementById('clock').innerText=
 new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
